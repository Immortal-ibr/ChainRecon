name: Nooie MQTT TLS Check
# Sample pipeline: scan device for MQTT, check TLS, flag critical if missing.
# Usage:
#   chainrecon workflow run workflows/nooie_mqtt_tls.yaml --target 192.168.123.99 --dry-run
#   chainrecon workflow run workflows/nooie_mqtt_tls.yaml --target 192.168.123.99 --device-profile nooie

variables:
  scan_profile: iot
  tls_ports: "8883"

steps:
  - id: port_scan
    type: scan
    target: "{{ target }}"
    profile: "{{ scan_profile }}"
    description: "IoT port scan to find open services including MQTT broker"

  - id: mqtt_tls_check
    type: tls_scan
    target: "{{ target }}"
    ports:
      - 8883
      - 443
      - 8443
    when: "steps.port_scan.status == 'completed' and 8883 in steps.port_scan.summary.open_ports"
    description: "Check TLS on MQTT (8883) and HTTPS ports; flag cleartext MQTT as critical"

  - id: require_mqtt_tls
    type: assert
    critical: true
    when: "steps.mqtt_tls_check.status == 'completed'"
    condition: "steps.mqtt_tls_check.summary.reachable_port_count > 0 and steps.mqtt_tls_check.summary.certificate_count > 0"
    message: "Port 8883 was open but TLS probing did not observe a certificate chain."
    description: "Fail workflow when MQTT runs without TLS and a certificate chain"

  - id: final_report
    type: report
    formats:
      - xlsx
      - html
      - json
    when: "steps.port_scan.status == 'completed'"
    description: "Generate XLSX, HTML, and JSON report of scan and TLS findings"

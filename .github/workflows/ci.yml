name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install source and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,tui]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Lint source and tests
        run: python -m ruff check chainrecon tests scripts --select E4,E7,E9,F
      - name: Type check case, firmware, workflow, and TUI routes
        run: python -m mypy chainrecon/analysis_catalog.py chainrecon/case_model.py chainrecon/case_analysis.py chainrecon/case_reporting.py chainrecon/elf_inspection.py chainrecon/firmware_engine.py chainrecon/v2_cli.py chainrecon/tui/app.py chainrecon/tui/screens/help_screen.py chainrecon/tui/screens/case_picker.py chainrecon/tui/screens/case.py chainrecon/tui/screens/case_analysis.py chainrecon/tui/screens/dashboard.py chainrecon/tui/screens/analyze.py chainrecon/tui/screens/apk.py chainrecon/tui/screens/reports.py chainrecon/tui/widgets/help_footer.py chainrecon/tui/widgets/path_input.py chainrecon/runners/workflow_runner.py chainrecon/utils/redaction.py --ignore-missing-imports --follow-imports=silent
      - name: Compile Python source
        run: python -m compileall -q chainrecon
      - name: Source CLI smoke
        run: python -I -m chainrecon --help
      - name: Run all offline tests with branch coverage
        env:
          PYTHONUTF8: '1'
        run: python -m pytest tests --cov=chainrecon --cov-branch --cov-report=xml:coverage.xml --cov-report=term --junitxml=test-results.xml
      - name: Check release coverage gates
        run: |
          python -m coverage json -o coverage.json
          python scripts/check_coverage.py coverage.json

  package-smoke:
    name: Source and wheel install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --upgrade pip build wheel
      - name: Build clean source and wheel distributions
        run: python scripts/build_clean.py --outdir dist
      - name: Check package metadata
        run: |
          python -m pip install twine
          python scripts/check_dist.py
      - name: Smoke clean wheel and source installs
        run: |
          python scripts/smoke_install.py dist/chainrecon-*.whl
          python scripts/smoke_install.py dist/chainrecon-*.tar.gz

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit declared dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit . --strict

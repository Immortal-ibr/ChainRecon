name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    name: Offline Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,tui]

      - name: Compile-check all Python sources
        env:
          PYTHONUTF8: "1"
        run: python -m compileall -q analysis runners tui plugins utils chainrecon.py

      - name: Collect-only debug
        if: runner.os == 'Linux'
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -m "unit or integration or requirement" --collect-only -q 2>&1 | tail -50

      - name: Run offline pytest suite (Linux)
        if: runner.os == 'Linux'
        id: pytest_run_linux
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pytest -m "unit or integration or requirement" --tb=long --junitxml=test-results.xml 2>&1 | tee pytest-output.txt
          exit ${PIPESTATUS[0]}

      - name: Print pytest output (Linux)
        if: runner.os == 'Linux' && always()
        run: |
          echo "=== PYTEST OUTPUT ==="
          cat pytest-output.txt 2>/dev/null || echo "No output file"

      - name: Run offline pytest suite (Windows)
        if: runner.os == 'Windows'
        id: pytest_run_windows
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -m "unit or integration or requirement" --tb=short --junitxml=test-results.xml

      - name: Dump test failures to step summary
        if: always()
        shell: python
        run: |
          import xml.etree.ElementTree as ET, os, sys
          results_path = "test-results.xml"
          if not os.path.exists(results_path):
              print("::warning::No test-results.xml found")
              sys.exit(0)
          try:
              tree = ET.parse(results_path)
              root = tree.getroot()
              failures = []
              for tc in root.iter("testcase"):
                  err = tc.find("failure") or tc.find("error")
                  if err is not None:
                      name = tc.get("classname", "") + "." + tc.get("name", "")
                      text = (err.text or "")[:3000]
                      failures.append((name, text))
              summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "")
              if summary_file and failures:
                  with open(summary_file, "a", encoding="utf-8") as f:
                      f.write("# Failed Tests\n\n")
                      for name, text in failures:
                          f.write(f"### {name}\n```\n{text}\n```\n\n")
              if failures:
                  print(f"Found {len(failures)} failure(s):")
                  for name, text in failures:
                      # Emit as GitHub Actions error annotation (visible in logs)
                      safe = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title={name}::{safe}")
              else:
                  print("All tests passed.")
          except Exception as exc:
              print(f"::error::Parse error: {exc}")

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test-results.xml
            pytest-output.txt
          if-no-files-found: ignore

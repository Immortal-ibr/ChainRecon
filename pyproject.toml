[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chainrecon"
version = "1.0.0"
description = "Cross-platform IoT security reconnaissance framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "pyshark>=0.6",
    "jinja2>=3.1",
    "requests>=2.31",
    "defusedxml>=0.7",
    "cryptography>=41.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
tui = ["textual>=0.40"]
frida = ["frida-tools>=12.0"]
full = [
    "python-nmap>=0.7",
    "scapy>=2.5",
    "pyja3>=1.0",
    "shodan>=1.28",
    "textual>=0.40",
    "frida-tools>=12.0",
    "openpyxl>=3.1",
    "weasyprint>=60.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
chainrecon = "chainrecon:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: fast isolated tests for pure functions and single classes",
    "integration: tests that combine multiple ChainRecon modules without a live device",
    "e2e: tests that exercise CLI/TUI workflows or live external tools",
    "requirement: tests that protect user-facing requirements and regressions",
]

[tool.setuptools.packages.find]
include = ["chainrecon*"]

[tool.setuptools.package-data]
"chainrecon.runners" = ["frida_scripts/*.js"]
